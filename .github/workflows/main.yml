module.new = function(name, config)
    local gaya = Instance.new(name)
    for index, value in next, config do
        gaya[index] = value
    end
    return gaya
end

module.Save = function()
    if not isfolder("navizin Hub") then
        makefolder("navizin Hub")
    end
    if not isfolder("navizin Hub/Settings") then
        makefolder("navizin Hub/Settings")
    end
    writefile("navizin Hub/Settings/" .. Hub.Game .. "-" .. plr.Name .. ".json", HttpService:JSONEncode(Settings))
end

module.Read = function()
    p1, p2 = pcall(function()
        if not isfolder("navizin Hub") then
            module.Save()
        end
        return HttpService:JSONDecode(readfile("navizin Hub/Settings/" .. Hub.Game .. "-" .. plr.Name .. ".json"))
    end)
    if p1 then
        return p2
    else
        module.Save()
        return module.Read()
    end
end

